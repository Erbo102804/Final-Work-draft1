services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foundex
      POSTGRES_USER: foundex
      POSTGRES_PASSWORD: foundex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundex -d foundex"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://foundex:foundex@db:5432/foundex
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_ADMIN_URL: http://localhost:8000/admin/
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
